<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zebra Labels - Sistema Stampa Etichette</title>
  <meta name="theme-color" content="#1A73E8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Zebra Labels">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
  <style>
    :root {
      --bg: #f8f9fa;
      --bg2: #ffffff;
      --bg3: #f1f3f4;
      --accent: #1a73e8;
      --accent-hover: #1557b0;
      --accent-light: rgba(26,115,232,.08);
      --green: #1e8e3e;
      --green-light: rgba(30,142,62,.08);
      --red: #d93025;
      --red-light: rgba(217,48,37,.08);
      --yellow: #e8710a;
      --yellow-light: rgba(232,113,10,.08);
      --purple: #9334e6;
      --purple-light: rgba(147,52,230,.08);
      --text: #1f1f1f;
      --text2: #5f6368;
      --text3: #9aa0a6;
      --border: #e8eaed;
      --border2: #dadce0;
      --radius: 16px;
      --radius-sm: 12px;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.05);
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
      --shadow-lg: 0 4px 16px rgba(0,0,0,.08);
      --surface-hover: #f1f3f4;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Google Sans','Inter',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; font-size:14px; -webkit-font-smoothing:antialiased; }

    /* Header */
    .app-header {
      background:var(--bg2); border-bottom:1px solid var(--border);
      padding:0 24px; height:64px; display:flex; align-items:center; justify-content:space-between;
      position:sticky; top:0; z-index:100;
    }
    .app-header .logo-area { display:flex; align-items:center; gap:12px; }
    .app-header .logo-area svg { flex-shrink:0; }
    .app-header h1 { font-size:18px; font-weight:500; color:var(--text); letter-spacing:-.2px; }
    .app-header h1 span { color:var(--text3); font-weight:400; font-size:14px; }

    .printer-status {
      display:flex; align-items:center; gap:8px; padding:8px 16px;
      border-radius:100px; font-size:13px; font-weight:500; cursor:pointer;
      transition:all .2s; border:none;
      background:var(--bg3); color:var(--text2);
    }
    .printer-status.online { background:var(--green-light); color:var(--green); }
    .printer-status.offline { background:var(--red-light); color:var(--red); }
    .printer-status.checking { background:var(--yellow-light); color:var(--yellow); }
    .dot { width:8px; height:8px; border-radius:50%; }
    .dot.green { background:var(--green); }
    .dot.red { background:var(--red); }
    .dot.yellow { background:var(--yellow); animation:pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* Tabs */
    .tabs {
      display:flex; gap:4px; background:var(--bg2); border-bottom:1px solid var(--border);
      padding:8px 24px 0;
    }
    .tab {
      padding:10px 20px; cursor:pointer; font-size:14px; color:var(--text2);
      border-bottom:3px solid transparent; transition:all .2s; font-weight:500;
      border-radius:var(--radius-sm) var(--radius-sm) 0 0;
    }
    .tab:hover { color:var(--text); background:var(--surface-hover); }
    .tab.active { color:var(--accent); border-bottom-color:var(--accent); background:transparent; }

    /* Main */
    .main { max-width:1400px; margin:0 auto; padding:28px; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    @media(max-width:900px) { .grid-2 { grid-template-columns:1fr; } }

    /* Designer 3-col layout */
    .designer-grid { display:grid; grid-template-columns:260px 1fr 340px; gap:16px; }
    .designer-grid .designer-models { overflow-y:auto; max-height:calc(100vh - 140px); }
    .designer-grid .designer-form { overflow-y:auto; max-height:calc(100vh - 140px); }
    .designer-grid .designer-preview { position:sticky; top:120px; align-self:start; order:2; }
    .designer-grid .designer-form { order:3; }
    @media(max-width:1200px) { .designer-grid { grid-template-columns:220px 1fr 300px; gap:12px; } }
    @media(max-width:920px) { .designer-grid { grid-template-columns:1fr; gap:12px; } .designer-preview { position:static; } }
    @media(max-width:600px) { .designer-grid { grid-template-columns:1fr; } .designer-models { max-height:none; } .designer-form { max-height:none; } }

    .designer-preview-inline { display:none; }
    @media(max-width:820px) { .designer-preview-inline { display:block; } }

    /* Responsive tabs */
    /* Responsive mobile */
    @media(max-width:600px) {
      .tabs { padding:0 8px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
      .tab { padding:8px 14px; font-size:13px; white-space:nowrap; }
      .main { padding:16px; }
      .app-header { padding:0 16px; height:56px; }
      .app-header h1 { font-size:15px; }
      .app-header h1 span { display:none; }
      .printer-status { font-size:12px; padding:6px 12px; }
      .grid-2 { gap:16px; }
      .card { padding:16px; }
      .inline-row { flex-direction:column; gap:0; }
      .settings-grid { grid-template-columns:1fr; }
    }

    /* Card */
    .card {
      background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius);
      padding:24px; margin-bottom:20px;
    }
    .card h2 {
      font-size:14px; color:var(--text); margin-bottom:20px;
      font-weight:500; letter-spacing:normal;
      display:flex; align-items:center; gap:8px;
    }

    /* Form elements */
    label { display:block; font-size:12px; color:var(--text2); margin-bottom:6px; font-weight:500; letter-spacing:.1px; }
    .field { margin-bottom:16px; }
    input, select, textarea {
      width:100%; padding:10px 14px; font-size:14px; font-family:'Google Sans','Inter',sans-serif;
      background:var(--bg3); border:1px solid transparent; border-radius:var(--radius-sm);
      color:var(--text); outline:none; transition:all .2s;
    }
    input:focus, select:focus, textarea:focus { background:var(--bg2); border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-light); }
    input:hover, select:hover, textarea:hover { background:#e8eaed; }
    input:focus:hover, select:focus:hover, textarea:focus:hover { background:var(--bg2); }
    select { cursor:pointer; }
    textarea { resize:vertical; min-height:60px; }

    /* Search */
    .search-input { position:relative; }
    .search-input input { padding-right:32px; }
    .search-dropdown {
      position:absolute; top:calc(100% + 4px); left:0; right:0; background:var(--bg2);
      border:1px solid var(--border); border-radius:var(--radius-sm);
      max-height:260px; overflow-y:auto; z-index:50; box-shadow:var(--shadow-lg);
    }
    .search-item { padding:10px 14px; cursor:pointer; font-size:14px; border-bottom:1px solid var(--bg3); transition:background .15s; }
    .search-item:hover { background:var(--surface-hover); }
    .search-item:last-child { border-bottom:none; }
    .search-item .name { font-weight:500; color:var(--text); }
    .search-item .detail { font-size:12px; color:var(--text2); margin-top:2px; }

    /* Client info */
    .client-info {
      display:grid; grid-template-columns:1fr 1fr; gap:10px;
      background:var(--bg3); border-radius:var(--radius-sm); padding:14px; font-size:13px; margin-top:10px;
      border:none;
    }
    .client-info .ci-label { color:var(--text3); font-size:11px; font-weight:500; }
    .client-info .ci-value { color:var(--text); word-break:break-all; }

    /* Buttons */
    .btn {
      padding:10px 20px; border:none; border-radius:100px; cursor:pointer;
      font-size:14px; font-weight:500; font-family:'Google Sans','Inter',sans-serif;
      transition:all .2s; display:inline-flex; align-items:center; gap:8px;
      letter-spacing:.1px;
    }
    .btn-primary { background:var(--accent); color:#fff; }
    .btn-primary:hover { background:var(--accent-hover); box-shadow:var(--shadow); }
    .btn-success { background:var(--green); color:#fff; }
    .btn-success:hover { background:#1a7c37; box-shadow:var(--shadow); }
    .btn-danger { background:var(--red); color:#fff; }
    .btn-danger:hover { background:#c42b21; }
    .btn-purple { background:var(--purple); color:#fff; }
    .btn-purple:hover { background:#7b2bc9; }
    .btn-outline {
      background:var(--bg2); color:var(--text2); border:1px solid var(--border2);
    }
    .btn-outline:hover { background:var(--surface-hover); border-color:var(--border2); color:var(--text); }
    .btn-sm { padding:6px 14px; font-size:13px; }
    .btn:disabled { opacity:.4; cursor:not-allowed; }

    /* Preview label */
    .preview-label {
      background:#fff; color:#000; border-radius:var(--radius-sm); padding:14px 16px;
      font-family:'Courier New',monospace; font-size:11px; line-height:1.6;
      min-height:180px; border:2px dashed var(--border2); position:relative; overflow:hidden;
    }
    .preview-label .pl-header { display:flex; align-items:flex-start; gap:8px; margin-bottom:4px; }
    .preview-label .pl-logo {
      width:40px; height:40px; background:var(--bg3); border:1px solid var(--border);
      border-radius:8px; display:flex; align-items:center; justify-content:center;
      font-size:8px; color:#999; flex-shrink:0; overflow:hidden;
    }
    .preview-label .pl-logo img { width:100%; height:100%; object-fit:contain; }
    .preview-label .pl-title { text-align:center; font-weight:bold; font-size:13px; flex:1; }
    .preview-label .pl-line { border-top:1px solid var(--border); margin:4px 0; }
    .preview-label .pl-motivo { font-weight:bold; text-align:center; margin:4px 0; }
    .preview-label .pl-barcode { text-align:center; font-size:10px; margin-top:6px; padding:4px; background:var(--bg); border-radius:6px; }
    .preview-label .pl-barcode-text { text-align:center; font-size:9px; color:var(--text2); }
    .label-canvas-wrap { border:1px solid var(--border); border-radius:14px; background:linear-gradient(180deg,#fff,#fafafa); padding:10px; }
    .label-canvas {
      position:relative; width:100%; aspect-ratio:440/280; border:2px dashed var(--border2);
      border-radius:12px; background:#fff; overflow:hidden; font-family:'Courier New',monospace;
      touch-action:none;
    }
    .label-item {
      position:absolute; border:1px dashed transparent; border-radius:6px; padding:2px 4px;
      font-size:11px; color:#111; cursor:grab; user-select:none; -webkit-user-select:none; white-space:nowrap; overflow:hidden;
      text-overflow:ellipsis; background:rgba(255,255,255,.65);
    }
    .label-item.line { background:transparent; padding:0; border:none; cursor:grab; }
    .label-item.line::after { content:''; position:absolute; left:0; right:0; top:0; height:2px; background:#111; }
    .label-item.barcode { text-align:center; letter-spacing:1px; }
    .label-item.hidden { opacity:.3; }
    .label-item.selected { border-color:var(--accent); background:rgba(26,115,232,.08); }
    .layout-info { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px; }

    /* ZPL code */
    .zpl-code {
      background:#202124; color:#81c995; padding:16px; border-radius:var(--radius-sm);
      font-family:'Courier New',monospace; font-size:12px; max-height:200px;
      overflow-y:auto; white-space:pre-wrap; word-break:break-all;
    }

    /* Toast */
    .toast {
      position:fixed; bottom:24px; right:24px; padding:14px 24px;
      border-radius:var(--radius-sm); font-size:14px; font-weight:500;
      box-shadow:var(--shadow-lg); z-index:1000; animation:slideIn .3s cubic-bezier(.2,.6,.35,1);
      display:flex; align-items:center; gap:10px;
    }
    .toast.success { background:#1e8e3e; color:#fff; }
    .toast.error { background:#d93025; color:#fff; }
    @keyframes slideIn { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }

    /* Table */
    .log-table { width:100%; border-collapse:collapse; font-size:14px; }
    .log-table th {
      text-align:left; padding:12px 14px; background:var(--bg3); color:var(--text2);
      font-weight:500; font-size:12px; letter-spacing:.2px;
    }
    .log-table th:first-child { border-radius:var(--radius-sm) 0 0 var(--radius-sm); }
    .log-table th:last-child { border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
    .log-table td { padding:12px 14px; border-bottom:1px solid var(--border); }
    .log-table tr:hover td { background:var(--surface-hover); }

    /* Badges */
    .badge { padding:4px 10px; border-radius:100px; font-size:12px; font-weight:500; }
    .badge-green { background:var(--green-light); color:var(--green); }
    .badge-red { background:var(--red-light); color:var(--red); }
    .badge-blue { background:var(--accent-light); color:var(--accent); }
    .badge-purple { background:var(--purple-light); color:var(--purple); }

    /* Radio/toggle */
    .radio-group { display:flex; gap:8px; }
    .radio-option {
      padding:8px 16px; border:1px solid var(--border2); border-radius:100px;
      cursor:pointer; font-size:14px; transition:all .2s; color:var(--text2); font-weight:500;
    }
    .radio-option:hover { background:var(--surface-hover); }
    .radio-option.selected { border-color:var(--accent); background:var(--accent-light); color:var(--accent); }

    /* Counter */
    .counter { display:flex; align-items:center; gap:8px; }
    .counter button {
      width:36px; height:36px; border-radius:100px; border:1px solid var(--border2);
      background:var(--bg2); color:var(--text); cursor:pointer; font-size:16px;
      display:flex; align-items:center; justify-content:center; transition:all .2s;
    }
    .counter button:hover { background:var(--surface-hover); }
    .counter input { width:56px; text-align:center; border-radius:var(--radius-sm); }

    /* Empty state */
    .empty-state { text-align:center; padding:48px 24px; color:var(--text2); }
    .empty-state .icon { font-size:40px; margin-bottom:16px; opacity:.4; }

    /* Modal */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.25); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      display:flex; align-items:center; justify-content:center; z-index:200;
      animation:fadeIn .2s ease;
    }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .modal {
      background:var(--bg2); border:none; border-radius:28px;
      padding:28px; width:90%; max-width:600px; max-height:85vh; overflow-y:auto;
      box-shadow:0 8px 32px rgba(0,0,0,.12);
      animation:modalIn .25s cubic-bezier(.2,.6,.35,1);
    }
    @keyframes modalIn { from{transform:scale(.95);opacity:0} to{transform:scale(1);opacity:1} }
    .modal h3 { margin-bottom:20px; font-size:18px; font-weight:500; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:24px; }

    /* Chips */
    .chip-group { display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
    .chip {
      padding:6px 14px; border-radius:100px; font-size:13px; cursor:pointer;
      border:1px solid var(--border2); transition:all .2s; user-select:none; -webkit-user-select:none; font-weight:500;
      color:var(--text2);
    }
    .chip.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    .chip:hover { background:var(--surface-hover); }
    .chip.active:hover { background:var(--accent-hover); }

    /* Logo upload */
    .logo-upload {
      border:2px dashed var(--border2); border-radius:var(--radius); padding:20px;
      text-align:center; cursor:pointer; transition:all .2s;
    }
    .logo-upload:hover { border-color:var(--accent); background:var(--accent-light); }
    .logo-upload.has-logo { border-style:solid; border-color:var(--green); }
    .logo-preview { max-width:80px; max-height:60px; margin:8px auto; display:block; }

    /* Font slider */
    .font-slider { display:flex; align-items:center; gap:10px; }
    .font-slider input[type=range] { flex:1; accent-color:var(--accent); height:4px; }
    .font-slider .val { min-width:36px; text-align:center; font-size:13px; color:var(--text2); font-weight:500; }

    /* Model card */
    .model-card {
      background:var(--bg2); border:1px solid var(--border); border-radius:var(--radius-sm);
      padding:14px; cursor:pointer; transition:all .2s;
    }
    .model-card:hover { background:var(--surface-hover); }
    .model-card.selected { border-color:var(--accent); background:var(--accent-light); }
    .model-card .mc-name { font-weight:500; font-size:14px; color:var(--text); }
    .model-card .mc-desc { font-size:12px; color:var(--text2); margin-top:4px; }
    .model-card .mc-badges { display:flex; gap:6px; margin-top:8px; }

    .inline-row { display:flex; gap:14px; }
    .inline-row > * { flex:1; }

    /* Settings */
    .settings-grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
    .settings-section { margin-bottom:24px; }
    .settings-section h3 { font-size:14px; font-weight:500; color:var(--text); margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--border); }
    .dim-preview { font-size:12px; color:var(--text3); margin-top:4px; }

    /* Scrollbar styling */
    ::-webkit-scrollbar { width:6px; height:6px; }
    ::-webkit-scrollbar-track { background:transparent; }
    ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:100px; }
    ::-webkit-scrollbar-thumb:hover { background:var(--text3); }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const API = '/api';

    // ====== SVG Logo Cloud3 ======
    function Cloud3Logo({ size = 32 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="200" height="200" rx="40" fill="#006fff"/>
          <path d="M140 105c0-22.1-17.9-40-40-40-17.6 0-32.5 11.4-37.8 27.2C48.8 94.8 38 107.2 38 122c0 17.7 14.3 32 32 32h68c15.5 0 28-12.5 28-28 0-13.8-10-25.3-23.4-27.6C143.5 113.2 140 105 140 105z" fill="white" opacity=".9"/>
          <text x="100" y="135" textAnchor="middle" fill="#006fff" fontFamily="Inter,sans-serif" fontWeight="700" fontSize="38">C3</text>
        </svg>
      );
    }

    // ====== Toast ======
    function Toast({ message, type, onClose }) {
      useEffect(() => { const t = setTimeout(onClose, 3000); return () => clearTimeout(t); }, []);
      return <div className={`toast ${type}`}>{type === 'success' ? '✅' : '❌'} {message}</div>;
    }

    // ====== Client Search ======
    function ClientSearch({ clienti, onSelect }) {
      const [query, setQuery] = useState('');
      const [open, setOpen] = useState(false);
      const ref = useRef(null);
      const filtered = query.length > 0
        ? clienti.filter(c => c.ragione_sociale.toLowerCase().includes(query.toLowerCase())).slice(0, 20)
        : clienti.slice(0, 20);
      useEffect(() => {
        const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
        document.addEventListener('mousedown', handler);
        return () => document.removeEventListener('mousedown', handler);
      }, []);
      return (
        <div className="search-input" ref={ref}>
          <input placeholder="Cerca cliente per ragione sociale..." value={query}
            onChange={e => { setQuery(e.target.value); setOpen(true); }} onFocus={() => setOpen(true)} />
          {open && filtered.length > 0 && (
            <div className="search-dropdown">
              {filtered.map(c => (
                <div key={c.id} className="search-item" onClick={() => { onSelect(c); setQuery(c.ragione_sociale); setOpen(false); }}>
                  <div className="name">{c.ragione_sociale}</div>
                  <div className="detail">{c.citta || 'N/D'} {c.telefono ? `• ${c.telefono}` : ''}</div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    const FIELD_DEFS = {
      cloud3: { label: 'CLOUD3', type: 'text', maxW: 180, maxH: 28, sample: 'CLOUD3' },
      data_top: { label: 'Data Header', type: 'text', maxW: 130, maxH: 24, sample: '01/04/2026' },
      titolo: { label: 'Titolo', type: 'text', maxW: 420, maxH: 40, sample: 'RITIRO ASSISTENZA' },
      line1: { label: 'Linea 1', type: 'line', maxW: 420, maxH: 4, sample: '' },
      cliente: { label: 'Cliente', type: 'text', maxW: 420, maxH: 30, sample: 'Cliente: Azienda Demo Srl' },
      dispositivo: { label: 'Dispositivo', type: 'text', maxW: 420, maxH: 26, sample: 'Disp: PC Desktop | DEMO2026PC01' },
      telefono_email: { label: 'Tel/Email', type: 'text', maxW: 420, maxH: 24, sample: 'Tel: 010123456 | info@demo.it' },
      indirizzo: { label: 'Indirizzo', type: 'text', maxW: 420, maxH: 24, sample: 'Ind: Via Roma 1 - Genova (GE)' },

    function LabelLayoutEditor({ layout, setLayout, selectedKey, setSelectedKey }) {
      const canvasRef = useRef(null);
      const dragRef = useRef(null);

      const onMouseDown = (e, key) => {
        e.preventDefault();
        const box = canvasRef.current.getBoundingClientRect();
        const it = layout.items[key];
        dragRef.current = {
          key,
          startX: e.clientX,
          startY: e.clientY,
          origX: it.x,
          origY: it.y,
          scaleX: 440 / box.width,
          scaleY: 280 / box.height
        };
        setSelectedKey(key);
      };

      useEffect(() => {
        const onMove = (e) => {
          if (!dragRef.current) return;
          const d = dragRef.current;
          const it = layout.items[d.key];
          const dx = Math.round((e.clientX - d.startX) * d.scaleX);
          const dy = Math.round((e.clientY - d.startY) * d.scaleY);
          const nx = Math.max(0, Math.min(440 - it.w, d.origX + dx));
          const ny = Math.max(0, Math.min(280 - it.h, d.origY + dy));
          setLayout(prev => ({
            ...prev,
            items: { ...prev.items, [d.key]: { ...prev.items[d.key], x: nx, y: ny } }
          }));
        };
        const onUp = () => { dragRef.current = null; };
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);
        return () => {
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('mouseup', onUp);
        };
      }, [layout, setLayout]);

      return (
        <div className="label-canvas-wrap">
          <div className="label-canvas" ref={canvasRef}>
            {Object.values(layout.items).sort((a,b)=>(a.z||0)-(b.z||0)).map(it => {
              const def = FIELD_DEFS[it.key] || {};
              const style = {
                left: `${(it.x / 440) * 100}%`,
                top: `${(it.y / 280) * 100}%`,
                width: `${(it.w / 440) * 100}%`,
                height: `${(it.h / 280) * 100}%`,
                fontSize: `${Math.max(9, Math.round((it.font || 14) * 0.55))}px`,
                textAlign: it.align === 'R' ? 'right' : (it.align === 'C' ? 'center' : 'left'),
                display: it.visible === false ? 'none' : 'block'
              };
              return (
                <div
                  key={it.key}
                  className={`label-item ${it.type === 'line' ? 'line' : ''} ${it.type === 'barcode' ? 'barcode' : ''} ${selectedKey === it.key ? 'selected' : ''}`}
                  style={style}
                  onMouseDown={(e) => onMouseDown(e, it.key)}
                  onClick={() => setSelectedKey(it.key)}
                  title={`${def.label || it.key} — drag`}
                >
                  {it.type === 'line' ? '' : (def.sample || it.key)}
                </div>
              );
            })}
          </div>
        </div>
      );
    }

      ];

      const openNew = () => {
        const newCampi = ['cliente','dispositivo','telefono_email','indirizzo','motivo','data','barcode'];

          nome: '', descrizione: '', titolo_zpl: '', motivo_zpl: '',

          campi_visibili: campi,

          font_dispositivo: m.font_dispositivo || 18, font_dettagli: m.font_dettagli || 16,
          font_motivo: m.font_motivo || 18, font_data: m.font_data || 14,
          show_barcode: m.show_barcode !== undefined ? m.show_barcode : 1
        });
        const parsedLayout = (() => {
          try {
            const lj = m.layout_json ? (typeof m.layout_json === 'string' ? JSON.parse(m.layout_json) : m.layout_json) : null;
            if (lj && lj.items) return lj;
          } catch(e) {}
          return makeDefaultLayout(campi, (m.show_barcode !== 0));
        })();
        setLayout(parsedLayout);
        setSelectedItemKey('titolo');
        setLogoFile(null);
        setLogoPreview(m.logo_zpl && m.logo_zpl.length > 10 ? 'existing' : null);
        setSelected(m); setEditing(true);
      };

      const toggleCampo = (id) => {
        if (CAMPI_VISIBILI_KEYS.has(id)) {
          setForm(f => ({
            ...f,
            campi_visibili: f.campi_visibili.includes(id)
              ? f.campi_visibili.filter(c => c !== id)
              : [...f.campi_visibili, id]
          }));
        }
        setLayout(prev => ({
          ...prev,
          items: {
            ...prev.items,
            [id]: prev.items[id] ? { ...prev.items[id], visible: !(prev.items[id].visible !== false) } : prev.items[id]
          }
        }));
      };

      const handleLogoChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 500000) return setToast({ message: 'Logo troppo grande (max 500KB)', type: 'error' });
        setLogoFile(file);
        const reader = new FileReader();
        reader.onload = (ev) => setLogoPreview(ev.target.result);
        reader.readAsDataURL(file);
      };

      const handleSave = async () => {
        if (!form.nome.trim()) return setToast({ message: 'Nome modello obbligatorio', type: 'error' });
        if (!form.titolo_zpl.trim()) return setToast({ message: 'Titolo etichetta obbligatorio', type: 'error' });
        try {
          const url = selected ? `${API}/modelli/${selected.id}` : `${API}/modelli`;
          const method = selected ? 'PUT' : 'POST';
          const res = await fetch(url, {
            method, headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              ...form,
              layout_json: layout
            })
          });
          const data = await res.json();
          if (res.ok) {
            const modId = data.id;
            if (logoFile && modId) {
              const reader = new FileReader();
              reader.onload = async (ev) => {
                const base64 = ev.target.result.split(',')[1];
                await fetch(`${API}/modelli/${modId}/logo`, {
                  method: 'POST', headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ image_base64: base64, max_width: 80, max_height: 60 })
                });
                reloadModelli();
              };
              reader.readAsDataURL(logoFile);
            }
            setToast({ message: selected ? 'Modello aggiornato!' : 'Modello creato!', type: 'success' });
            setEditing(false);
            reloadModelli();
          } else {
            setToast({ message: data.error || 'Errore', type: 'error' });
          }
        } catch (e) {
          setToast({ message: 'Errore salvataggio', type: 'error' });
        }
      };

      const handleDelete = async (m) => {
        if (!m.is_custom) return setToast({ message: 'Non puoi eliminare modelli predefiniti', type: 'error' });
        try {
          await fetch(`${API}/modelli/${m.id}`, { method: 'DELETE' });
          setToast({ message: 'Modello eliminato', type: 'success' });
          reloadModelli();
        } catch (e) {
          setToast({ message: 'Errore eliminazione', type: 'error' });
        }
      };

      const handleRemoveLogo = async () => {
        if (selected) {
          await fetch(`${API}/modelli/${selected.id}/logo`, { method: 'DELETE' });
          reloadModelli();
        }
        setLogoFile(null); setLogoPreview(null);
      };

      const handleClone = async (m) => {
        try {
          const res = await fetch(`${API}/modelli/${m.id}/clone`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' }
          });
          if (!res.ok) {
            const errText = await res.text();
            let errMsg = 'Errore clone';
            try { errMsg = JSON.parse(errText).error || errMsg; } catch(e) {}
            setToast({ message: errMsg, type: 'error' });
            return;
          }
          const data = await res.json();
          if (data && data.id) {
            setToast({ message: `Modello "${data.nome}" clonato!`, type: 'success' });
            await reloadModelli();
            setTimeout(() => openEdit(data), 100);
          } else {
            setToast({ message: 'Errore clone: risposta non valida', type: 'error' });
          }
        } catch (e) {
          setToast({ message: 'Errore clone: ' + e.message, type: 'error' });
        }
      };

      const demoCliente = { ragione_sociale: 'Azienda Demo Srl', telefono: '010123456', email: 'info@demo.it', indirizzo: 'Via Roma 1', citta: 'Genova (GE)' };

      const previewComponent = (
        <LabelPreview
          modello={form.nome}
          modelloObj={{...form, show_barcode: form.show_barcode}}
          cliente={demoCliente}
          tipoDisp="PC Desktop"
          nomeDisp="DEMO2026PC01"
          logoDataUrl={logoPreview !== 'existing' ? logoPreview : null}
        />
      );
      const selectedItem = layout?.items?.[selectedItemKey];
      const itemDef = FIELD_DEFS[selectedItemKey] || {};

      return (
        <div className="designer-grid">
          {/* Colonna 1: Lista modelli */}
          <div className="designer-models">
            <div className="card">
              <h2>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                Modelli Etichetta
              </h2>
              <button className="btn btn-primary btn-sm" onClick={openNew} style={{marginBottom:12,width:'100%'}}>+ Nuovo Modello</button>
              <div style={{display:'flex',flexDirection:'column',gap:6}}>
                {modelli.map(m => (
                  <div key={m.id} className={`model-card ${selected?.id === m.id ? 'selected' : ''}`} onClick={() => openEdit(m)} style={{padding:10}}>
                    <div className="mc-name" style={{fontSize:13}}>{m.nome}</div>
                    <div className="mc-desc" style={{fontSize:11}}>{m.descrizione || m.titolo_zpl}</div>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
                      <div className="mc-badges">
                        <span className={`badge ${m.is_custom ? 'badge-purple' : 'badge-blue'}`}>{m.is_custom ? 'Custom' : 'Base'}</span>
                        {m.logo_zpl && m.logo_zpl.length > 10 && <span className="badge badge-green">Logo</span>}
                      </div>
                      <div style={{display:'flex',gap:3}}>
                        <button className="btn btn-outline btn-sm" style={{padding:'3px 6px'}} onClick={(e) => { e.stopPropagation(); handleClone(m); }} title="Clona">
                          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                        </button>
                        {m.is_custom ? (
                          <button className="btn btn-danger btn-sm" style={{padding:'3px 6px'}} onClick={(e) => { e.stopPropagation(); handleDelete(m); }} title="Elimina">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                          </button>
                        ) : null}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* Colonna 2: Canvas etichetta drag&drop */}
          <div className="designer-preview">
            {editing ? (
              <div className="card">
                <h2>Anteprima Etichetta (drag & drop)</h2>
                <div style={{fontSize:12,color:'var(--text2)',marginBottom:8}}>
                  Dimensione reale: {settings?.label_width_mm || 55} x {settings?.label_height_mm || 35} mm
                </div>
                <LabelLayoutEditor layout={layout} setLayout={setLayout} selectedKey={selectedItemKey} setSelectedKey={setSelectedItemKey} />
                <div className="layout-info">
                  <div><span style={{color:'var(--text2)'}}>Campo:</span> <strong>{itemDef.label || selectedItemKey}</strong></div>
                  <div><span style={{color:'var(--text2)'}}>Tipo:</span> <strong>{itemDef.type || selectedItem?.type || '-'}</strong></div>
                </div>
              </div>
            ) : (
              <div className="card" style={{textAlign:'center',color:'var(--text3)',fontSize:12,padding:24}}>
                Seleziona o crea un modello per aprire il canvas layout
              </div>
            )}
          </div>

          {/* Colonna 3: Form / proprietà */}
          <div className="designer-form">
            {editing ? (
              <>
                <div className="card">
                  <h2>{selected ? 'Modifica Modello' : 'Nuovo Modello'}</h2>
                  <div className="inline-row">
                    <div className="field">
                      <label>Nome Modello *</label>
                      <input value={form.nome} onChange={e => setForm({...form, nome: e.target.value})}
                        placeholder="Es: Consegna Express" disabled={selected && !selected.is_custom} />
                    </div>
                    <div className="field">
                      <label>Descrizione</label>
                      <input value={form.descrizione} onChange={e => setForm({...form, descrizione: e.target.value})}
                        placeholder="Breve descrizione" />
                    </div>
                  </div>
                  <div className="inline-row">
                    <div className="field">
                      <label>Titolo Etichetta (ZPL) *</label>
                      <input value={form.titolo_zpl} onChange={e => setForm({...form, titolo_zpl: e.target.value})}
                        placeholder="Es: CONSEGNA EXPRESS" />
                    </div>
                    <div className="field">
                      <label>Testo Motivo/Azione</label>
                      <input value={form.motivo_zpl} onChange={e => setForm({...form, motivo_zpl: e.target.value})}
                        placeholder="Es: >> CONSEGNA EXPRESS <<" />
                    </div>
                  </div>
                  <div className="field">
                    <label>Logo (PNG, max 500KB)</label>
                    <div className="logo-upload" onClick={() => fileInputRef.current?.click()}
                      style={logoPreview ? {borderColor:'var(--green)',borderStyle:'solid'} : {}}>
                      <input type="file" ref={fileInputRef} accept="image/png,image/jpeg" onChange={handleLogoChange} style={{display:'none'}} />
                      {logoPreview && logoPreview !== 'existing' ? (
                        <div>
                          <img src={logoPreview} alt="logo" className="logo-preview" />
                          <div style={{fontSize:12,color:'var(--green)'}}>Logo caricato</div>
                        </div>
                      ) : logoPreview === 'existing' ? (
                        <div style={{fontSize:12,color:'var(--green)'}}>Logo esistente nel modello</div>
                      ) : (
                        <div style={{fontSize:12,color:'var(--text2)'}}>Clicca per caricare un logo</div>
                      )}
                    </div>
                    {logoPreview && (
                      <button className="btn btn-outline btn-sm" style={{marginTop:6}} onClick={handleRemoveLogo}>Rimuovi Logo</button>
                    )}
                  </div>
                  <div className="field">
                    <label>Campi Visibili</label>
                    <div className="chip-group">
                      {allCampi.map(c => (
                        <div key={c.id} className={`chip ${
                          CAMPI_VISIBILI_KEYS.has(c.id)
                            ? (form.campi_visibili.includes(c.id) ? 'active' : '')
                            : (layout?.items?.[c.id]?.visible !== false ? 'active' : '')
                        }`}
                          onClick={() => toggleCampo(c.id)}>{c.label}</div>
                      ))}
                    </div>
                  </div>
                  {selectedItem && (
                    <div className="field">
                      <label>Posizione campo selezionato</label>
                      <div className="inline-row">
                        <div>
                          <label style={{fontSize:11,color:'var(--text2)'}}>X</label>
                          <input type="number" value={selectedItem.x}
                            onChange={e => setLayout(prev => ({...prev, items: {...prev.items, [selectedItemKey]: {...prev.items[selectedItemKey], x: Math.max(0, Math.min(440 - prev.items[selectedItemKey].w, parseInt(e.target.value)||0))}}}))} />
                        </div>
                        <div>
                          <label style={{fontSize:11,color:'var(--text2)'}}>Y</label>
                          <input type="number" value={selectedItem.y}
                            onChange={e => setLayout(prev => ({...prev, items: {...prev.items, [selectedItemKey]: {...prev.items[selectedItemKey], y: Math.max(0, Math.min(280 - prev.items[selectedItemKey].h, parseInt(e.target.value)||0))}}}))} />
                        </div>
                      </div>
                      <div className="inline-row">
                        <div>
                          <label style={{fontSize:11,color:'var(--text2)'}}>Larghezza</label>
                          <input type="number" value={selectedItem.w}
                            onChange={e => setLayout(prev => {
                              const maxW = (FIELD_DEFS[selectedItemKey]?.maxW || 420);
                              const v = Math.max(20, Math.min(maxW, parseInt(e.target.value)||20));
                              return ({...prev, items: {...prev.items, [selectedItemKey]: {...prev.items[selectedItemKey], w: v}}});
                            })} />
                        </div>
                        <div>
                          <label style={{fontSize:11,color:'var(--text2)'}}>Altezza</label>
                          <input type="number" value={selectedItem.h}
                            onChange={e => setLayout(prev => {
                              const maxH = (FIELD_DEFS[selectedItemKey]?.maxH || 100);
                              const v = Math.max(8, Math.min(maxH, parseInt(e.target.value)||8));
                              return ({...prev, items: {...prev.items, [selectedItemKey]: {...prev.items[selectedItemKey], h: v}}});
                            })} />
                        </div>
                      </div>
                      <div style={{fontSize:11,color:'var(--text3)',marginTop:6}}>
                        Ingombro max consigliato: {FIELD_DEFS[selectedItemKey]?.maxW || '-'} x {FIELD_DEFS[selectedItemKey]?.maxH || '-'} dot
                      </div>
                    </div>
                  )}
                  <div className="field">
                    <label>Dimensioni Font</label>
                    {[
                      { key: 'font_titolo', label: 'Titolo', min: 16, max: 30 },
                      { key: 'font_cliente', label: 'Cliente', min: 14, max: 24 },
                      { key: 'font_dispositivo', label: 'Dispositivo', min: 12, max: 22 },
                      { key: 'font_dettagli', label: 'Dettagli', min: 10, max: 20 },
                      { key: 'font_motivo', label: 'Motivo', min: 12, max: 22 },
                      { key: 'font_data', label: 'Data', min: 10, max: 18 }
                    ].map(f => (
                      <div key={f.key} className="font-slider" style={{marginBottom:4}}>
                        <span style={{fontSize:11,color:'var(--text2)',minWidth:70}}>{f.label}</span>
                        <input type="range" min={f.min} max={f.max} value={form[f.key]}
                          onChange={e => setForm({...form, [f.key]: parseInt(e.target.value)})} />
                        <span className="val">{form[f.key]}pt</span>
                      </div>
                    ))}
                  </div>
                  <div className="field">
                    <label style={{display:'flex',alignItems:'center',gap:8}}>
                      <input type="checkbox" style={{width:'auto',accentColor:'var(--accent)'}} checked={form.show_barcode === 1}
                        onChange={e => setForm({...form, show_barcode: e.target.checked ? 1 : 0})} />
                      Mostra Barcode Code 128
                    </label>
                  </div>
                  <div className="modal-actions" style={{marginTop:16}}>
                    <button className="btn btn-outline" onClick={() => setEditing(false)}>Annulla</button>
                    <button className="btn btn-primary" onClick={handleSave}>Salva Modello</button>
                  </div>
                </div>
              </>
            ) : (
              <div className="card">
                <div className="empty-state">
                  <div className="icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a0aab4" strokeWidth="1.5"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
                  </div>
                  <div>Seleziona un modello per modificarlo<br/>o crea un nuovo modello personalizzato</div>
                </div>
              </div>
            )}
          </div>

        </div>
      );
    }

    // ====== Main Print Page ======
    function PrintPage({ clienti, modelli, setToast, reloadClienti, settings }) {
      const [modoCliente, setModoCliente] = useState('rubrica');
      const [cliente, setCliente] = useState(null);
      const [clienteManuale, setClienteManuale] = useState({ ragione_sociale:'', telefono:'', email:'', indirizzo:'', citta:'' });
      const [salvaRubrica, setSalvaRubrica] = useState(false);
      const [modelloNome, setModelloNome] = useState('Preparazione Dispositivo');
      const [tipoDisp, setTipoDisp] = useState('PC Desktop');
      const [modalita, setModalita] = useState('Automatica');
      const [nomeManuale, setNomeManuale] = useState('');
      const [prefisso, setPrefisso] = useState('');
      const [quantita, setQuantita] = useState(1);
      const [copie, setCopie] = useState(1);
      const [zplPreview, setZplPreview] = useState('');
      const [printing, setPrinting] = useState(false);

      const modelloObj = modelli.find(m => m.nome === modelloNome);
      const clienteEff = modoCliente === 'nessuno'
        ? { ragione_sociale: '', telefono: '', email: '', indirizzo: '', citta: '' }
        : modoCliente === 'manuale' ? clienteManuale : cliente;

      useEffect(() => {
        if (clienteEff && clienteEff.ragione_sociale && modalita === 'Automatica') {
          const words = clienteEff.ragione_sociale.split(/\s+/);
          let prefix = words[0].substring(0, 3).toUpperCase();
          const year = new Date().getFullYear();
          const tipoCodes = { 'PC Desktop': 'PC', 'Notebook': 'NB', 'Monitor': 'MN', 'Stampante': 'ST', 'Altro': 'XX' };
          setPrefisso(`${prefix}${year}${tipoCodes[tipoDisp] || 'XX'}`);
        } else if (modoCliente === 'nessuno' && modalita === 'Automatica') {
          const year = new Date().getFullYear();
          const tipoCodes = { 'PC Desktop': 'PC', 'Notebook': 'NB', 'Monitor': 'MN', 'Stampante': 'ST', 'Altro': 'XX' };
          setPrefisso(`LAB${year}${tipoCodes[tipoDisp] || 'XX'}`);
        }
      }, [clienteEff?.ragione_sociale, tipoDisp, modalita, modoCliente]);

      const nomeDisp = modalita === 'Manuale' ? nomeManuale : (prefisso ? `${prefisso}01` : '---');
      const nomiGen = modalita === 'Automatica' && prefisso
        ? Array.from({length: quantita}, (_, i) => `${prefisso}${String(i+1).padStart(2,'0')}`)
        : [nomeManuale || 'DISPOSITIVO'];
      const canPrint = modoCliente === 'nessuno' || (modoCliente === 'rubrica' && cliente) || (modoCliente === 'manuale');

      const buildBody = () => ({
        cliente_id: cliente?.id || 0,
        modello: modelloNome,
        modello_id: modelloObj?.id,
        tipo_dispositivo: tipoDisp,
        modalita, nome_dispositivo: nomeManuale, prefisso, quantita, copie,
        modo_cliente: modoCliente,
        cliente_manuale: modoCliente === 'manuale' ? clienteManuale : undefined,
        salva_in_rubrica: salvaRubrica,
        stampante_ip: settings.printer_ip,
        stampante_porta: settings.printer_port
      });

      const handleGenera = async () => {
        if (!canPrint) return setToast({ message: 'Configura il cliente', type: 'error' });
        const res = await fetch(`${API}/stampa/genera-zpl`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBody())
        });
        const data = await res.json();
        setZplPreview(data.zpl);
      };

      const handleStampa = async () => {
        if (!canPrint) return setToast({ message: 'Configura il cliente', type: 'error' });
        setPrinting(true);
        try {
          const res = await fetch(`${API}/stampa/invia`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBody())
          });
          const data = await res.json();
          if (data.success) {
            setToast({ message: `Stampate ${data.etichette_generate} etichette (${data.totale_stampe_fisiche} copie)`, type: 'success' });
            if (salvaRubrica && modoCliente === 'manuale' && reloadClienti) reloadClienti();
          } else {
            setToast({ message: data.error || 'Errore stampa', type: 'error' });
          }
        } catch (e) {
          setToast({ message: 'Errore connessione', type: 'error' });
        } finally { setPrinting(false); }
      };

      return (
        <div className="grid-2">
          <div>
            <div className="card">
              <h2>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                Configurazione Etichetta
              </h2>

              <div className="field">
                <label>Modalità Cliente</label>
                <div className="radio-group" style={{flexWrap:'wrap'}}>
                  {[
                    { id: 'rubrica', label: 'Da Rubrica' },
                    { id: 'manuale', label: 'Manuale' },
                    { id: 'nessuno', label: 'Laboratorio' }
                  ].map(m => (
                    <div key={m.id} className={`radio-option ${modoCliente === m.id ? 'selected' : ''}`}
                      onClick={() => setModoCliente(m.id)}>
                      {m.label}
                    </div>
                  ))}
                </div>
                {modoCliente === 'nessuno' && (
                  <div style={{fontSize:11,color:'var(--yellow)',marginTop:6}}>
                    Etichetta generica di laboratorio — nessun dato cliente stampato
                  </div>
                )}
              </div>

              {modoCliente === 'rubrica' && (
                <div className="field">
                  <label>Cliente *</label>
                  <ClientSearch clienti={clienti} onSelect={setCliente} />
                  {cliente && (
                    <div className="client-info">
                      <div><div className="ci-label">Telefono</div><div className="ci-value">{cliente.telefono || 'N/D'}</div></div>
                      <div><div className="ci-label">Email</div><div className="ci-value">{cliente.email || 'N/D'}</div></div>
                      <div><div className="ci-label">Indirizzo</div><div className="ci-value">{cliente.indirizzo || 'N/D'}</div></div>
                      <div><div className="ci-label">Città</div><div className="ci-value">{cliente.citta || 'N/D'}</div></div>
                    </div>
                  )}
                </div>
              )}

              {modoCliente === 'manuale' && (
                <div style={{background:'var(--bg)',borderRadius:6,padding:12,marginBottom:14,border:'1px solid var(--border)'}}>
                  <div className="field">
                    <label>Ragione Sociale</label>
                    <input value={clienteManuale.ragione_sociale} onChange={e => setClienteManuale({...clienteManuale, ragione_sociale: e.target.value})}
                      placeholder="Nome azienda o persona" />
                  </div>
                  <div className="inline-row">
                    <div className="field">
                      <label>Telefono</label>
                      <input value={clienteManuale.telefono} onChange={e => setClienteManuale({...clienteManuale, telefono: e.target.value})} />
                    </div>
                    <div className="field">
                      <label>Email</label>
                      <input value={clienteManuale.email} onChange={e => setClienteManuale({...clienteManuale, email: e.target.value})} />
                    </div>
                  </div>
                  <div className="inline-row">
                    <div className="field">
                      <label>Indirizzo</label>
                      <input value={clienteManuale.indirizzo} onChange={e => setClienteManuale({...clienteManuale, indirizzo: e.target.value})} />
                    </div>
                    <div className="field">
                      <label>Città</label>
                      <input value={clienteManuale.citta} onChange={e => setClienteManuale({...clienteManuale, citta: e.target.value})} placeholder="Es: Genova (GE)" />
                    </div>
                  </div>
                  <label style={{display:'flex',alignItems:'center',gap:8,marginTop:4,cursor:'pointer'}}>
                    <input type="checkbox" style={{width:'auto',accentColor:'var(--accent)'}} checked={salvaRubrica}
                      onChange={e => setSalvaRubrica(e.target.checked)} />
                    <span style={{fontSize:12}}>Salva questo cliente in rubrica dopo la stampa</span>
                  </label>
                </div>
              )}

              <div className="field">
                <label>Modello Etichetta</label>
                <select value={modelloNome} onChange={e => setModelloNome(e.target.value)}>
                  {modelli.map(m => (
                    <option key={m.id} value={m.nome}>{m.nome}{m.is_custom ? ' ✨' : ''}</option>
                  ))}
                </select>
              </div>
              <div className="field">
                <label>Tipo Dispositivo</label>
                <select value={tipoDisp} onChange={e => setTipoDisp(e.target.value)}>
                  <option>PC Desktop</option><option>Notebook</option><option>Monitor</option><option>Stampante</option><option>Altro</option>
                </select>
              </div>
              <div className="field">
                <label>Modalità Nome</label>
                <div className="radio-group">
                  {['Manuale', 'Automatica'].map(m => (
                    <div key={m} className={`radio-option ${modalita === m ? 'selected' : ''}`} onClick={() => setModalita(m)}>
                      {m}
                    </div>
                  ))}
                </div>
              </div>
              {modalita === 'Manuale' ? (
                <div className="field">
                  <label>Nome Dispositivo</label>
                  <input value={nomeManuale} onChange={e => setNomeManuale(e.target.value)} placeholder="Es: PC-RECEPTION-01" />
                </div>
              ) : (
                <>
                  <div className="field">
                    <label>Prefisso</label>
                    <input value={prefisso} onChange={e => setPrefisso(e.target.value)} placeholder="Es: CAV2026PC" />
                  </div>
                  <div className="field">
                    <label>Quantità (1-20)</label>
                    <div className="counter">
                      <button onClick={() => setQuantita(Math.max(1, quantita - 1))}>&#8722;</button>
                      <input type="number" min="1" max="20" value={quantita}
                        onChange={e => setQuantita(Math.min(20, Math.max(1, parseInt(e.target.value) || 1)))} />
                      <button onClick={() => setQuantita(Math.min(20, quantita + 1))}>+</button>
                    </div>
                    {quantita > 1 && <div style={{fontSize:11,color:'var(--text2)',marginTop:6}}>
                      Nomi: {nomiGen.slice(0,3).join(', ')}{quantita > 3 ? `, ... ${nomiGen[quantita-1]}` : ''}
                    </div>}
                  </div>
                </>
              )}
              <div className="field">
                <label>Copie per etichetta (1-99)</label>
                <div className="counter">
                  <button onClick={() => setCopie(Math.max(1, copie - 1))}>&#8722;</button>
                  <input type="number" min="1" max="99" value={copie}
                    onChange={e => setCopie(Math.min(99, Math.max(1, parseInt(e.target.value) || 1)))} />
                  <button onClick={() => setCopie(Math.min(99, copie + 1))}>+</button>
                </div>
              </div>
            </div>
            <div style={{display:'flex',gap:10}}>
              <button className="btn btn-outline" style={{flex:1}} onClick={handleGenera}>Genera ZPL</button>
              <button className="btn btn-success" style={{flex:2}} onClick={handleStampa} disabled={printing || !canPrint}>
                {printing ? 'Invio...' : 'STAMPA'}
              </button>
            </div>
          </div>
          <div>
            <div className="card">
              <h2>Anteprima Etichetta</h2>
              <LabelPreview modello={modelloNome} modelloObj={modelloObj} cliente={clienteEff} tipoDisp={tipoDisp} nomeDisp={nomeDisp} />
              {modalita === 'Automatica' && quantita > 1 && (
                <div style={{marginTop:12,fontSize:12,color:'var(--text2)',textAlign:'center'}}>
                  Anteprima prima etichetta — {quantita} etichette × {copie} copie = {quantita * copie} stampe
                </div>
              )}
            </div>
            {zplPreview && (
              <div className="card">
                <h2>Codice ZPL</h2>
                <div className="zpl-code">{zplPreview}</div>
                <button className="btn btn-outline btn-sm" style={{marginTop:8}}
                  onClick={() => { navigator.clipboard.writeText(zplPreview); setToast({message:'ZPL copiato!',type:'success'}); }}>
                  Copia
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ====== Storico Page ======
    function StoricoPage({ setToast }) {
      const [logs, setLogs] = useState([]);
      const [total, setTotal] = useState(0);
      const [page, setPage] = useState(1);
      const fetchLogs = async () => {
        const res = await fetch(`${API}/stampa/log?page=${page}&limit=15`);
        const data = await res.json();
        setLogs(data.logs); setTotal(data.total);
      };
      useEffect(() => { fetchLogs(); }, [page]);

      const handleRistampa = async (id) => {
        const res = await fetch(`${API}/stampa/ristampa/${id}`, { method: 'POST' });
        const data = await res.json();
        setToast({ message: data.success ? 'Ristampa inviata!' : (data.error || 'Errore'), type: data.success ? 'success' : 'error' });
        if (data.success) fetchLogs();
      };
      const totalPages = Math.ceil(total / 15);
      return (
        <div className="card">
          <h2>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Storico Stampe ({total})
          </h2>
          {logs.length === 0 ? (
            <div className="empty-state"><div className="icon">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#a0aab4" strokeWidth="1.5"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
            </div><div>Nessuna stampa</div></div>
          ) : (
            <>
              <div style={{overflowX:'auto'}}>
                <table className="log-table">
                  <thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Modello</th><th>Dispositivo</th><th>Qta</th><th>Copie</th><th>Stato</th><th></th></tr></thead>
                  <tbody>
                    {logs.map(l => {
                      const d = new Date(l.data_stampa);
                      return (
                        <tr key={l.id}>
                          <td>{l.id}</td>
                          <td style={{whiteSpace:'nowrap'}}>{d.getDate()}/{d.getMonth()+1}/{d.getFullYear()} {String(d.getHours()).padStart(2,'0')}:{String(d.getMinutes()).padStart(2,'0')}</td>
                          <td>{l.cliente_nome}</td><td>{l.modello}</td>
                          <td style={{fontSize:12,maxWidth:200,overflow:'hidden',textOverflow:'ellipsis'}}>{l.nome_dispositivo}</td>
                          <td>{l.quantita}</td><td>{l.copie}</td>
                          <td><span className={`badge ${l.stato==='inviato'||l.stato==='ristampato'?'badge-green':'badge-red'}`}>{l.stato}</span></td>
                          <td><button className="btn btn-outline btn-sm" onClick={() => handleRistampa(l.id)} title="Ristampa">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                          </button></td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {totalPages > 1 && (
                <div style={{display:'flex',justifyContent:'center',gap:8,marginTop:16}}>
                  <button className="btn btn-outline btn-sm" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>← Prec</button>
                  <span style={{padding:'6px 12px',fontSize:13,color:'var(--text2)'}}>Pag {page}/{totalPages}</span>
                  <button className="btn btn-outline btn-sm" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>Succ →</button>
                </div>
              )}
            </>
          )}
        </div>
      );
    }

    // ====== Clienti Page ======
    function ClientiPage({ clienti, reloadClienti, setToast }) {
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ ragione_sociale: '', telefono: '', email: '', indirizzo: '', citta: '' });
      const filtered = search ? clienti.filter(c => c.ragione_sociale.toLowerCase().includes(search.toLowerCase())) : clienti;

      const handleSave = async () => {
        if (!form.ragione_sociale.trim()) return setToast({ message: 'Ragione sociale obbligatoria', type: 'error' });
        const url = editing === 'new' ? `${API}/clienti` : `${API}/clienti/${editing}`;
        await fetch(url, { method: editing==='new'?'POST':'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
        setToast({ message: editing==='new'?'Cliente creato!':'Cliente aggiornato!', type: 'success' });
        setEditing(null); reloadClienti();
      };

      return (
        <div className="card">
          <h2>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Gestione Clienti ({clienti.length})
          </h2>
          <div style={{display:'flex',gap:12,marginBottom:16}}>
            <input placeholder="Cerca cliente..." value={search} onChange={e=>setSearch(e.target.value)} style={{flex:1}} />
            <button className="btn btn-primary btn-sm" onClick={()=>{setForm({ragione_sociale:'',telefono:'',email:'',indirizzo:'',citta:''});setEditing('new');}}>+ Nuovo</button>
          </div>
          <div style={{overflowX:'auto',maxHeight:'60vh',overflowY:'auto'}}>
            <table className="log-table">
              <thead><tr><th>ID</th><th>Ragione Sociale</th><th>Telefono</th><th>Email</th><th>Città</th><th></th></tr></thead>
              <tbody>
                {filtered.slice(0,50).map(c => (
                  <tr key={c.id}><td>{c.id}</td><td style={{fontWeight:500}}>{c.ragione_sociale}</td><td>{c.telefono||'-'}</td>
                    <td style={{fontSize:12}}>{c.email||'-'}</td><td>{c.citta||'-'}</td>
                    <td><button className="btn btn-outline btn-sm" onClick={()=>{setForm({ragione_sociale:c.ragione_sociale,telefono:c.telefono,email:c.email,indirizzo:c.indirizzo,citta:c.citta});setEditing(c.id);}}>
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button></td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
          {filtered.length > 50 && <div style={{textAlign:'center',padding:12,fontSize:13,color:'var(--text2)'}}>50 di {filtered.length} mostrati</div>}
          {editing !== null && (
            <div className="modal-overlay" onClick={()=>setEditing(null)}>
              <div className="modal" onClick={e=>e.stopPropagation()}>
                <h3>{editing==='new'?'Nuovo Cliente':'Modifica Cliente'}</h3>
                {['ragione_sociale','telefono','email','indirizzo','citta'].map(k => (
                  <div className="field" key={k}>
                    <label>{k==='ragione_sociale'?'Ragione Sociale *':k==='citta'?'Città':k.charAt(0).toUpperCase()+k.slice(1)}</label>
                    <input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={k==='citta'?'Es: Genova (GE)':''} />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn btn-outline" onClick={()=>setEditing(null)}>Annulla</button>
                  <button className="btn btn-primary" onClick={handleSave}>Salva</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ====== App ======
    function App() {
      const [tab, setTab] = useState('stampa');
      const [clienti, setClienti] = useState([]);
      const [modelli, setModelli] = useState([]);
      const [printerStatus, setPrinterStatus] = useState('checking');
      const [toast, setToast] = useState(null);
      const [settings, setSettings] = useState({
        printer_ip: '10.0.50.92', printer_port: 9100,
        label_width_mm: 55, label_height_mm: 35, dpi: 203,
        top_margin_dots: 14, show_barcode: false, show_cloud3_header: true, hide_logo: true
      });

      const loadClienti = async () => { const r = await fetch(`${API}/clienti/all`); setClienti(await r.json()); };
      const loadModelli = async () => { const r = await fetch(`${API}/modelli`); setModelli(await r.json()); };
      const loadSettings = async () => {
        try { const r = await fetch(`${API}/impostazioni`); const d = await r.json(); setSettings(d); } catch(e) {}
      };
      const checkPrinter = async () => {
        try {
          setPrinterStatus('checking');
          const r = await fetch(`${API}/stampante/stato?ip=${settings.printer_ip}&porta=${settings.printer_port}`);
          const d = await r.json();
          setPrinterStatus(d.online ? 'online' : 'offline');
        } catch(e) { setPrinterStatus('offline'); }
      };

      useEffect(() => {
        loadClienti(); loadModelli(); loadSettings();
      }, []);

      useEffect(() => {
        checkPrinter();
        const iv = setInterval(checkPrinter, 30000);
        return () => clearInterval(iv);
      }, [settings.printer_ip, settings.printer_port]);

      const TabIcon = ({ name }) => {
        const icons = {
          stampa: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
          designer: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>,
          storico: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
          clienti: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
          impostazioni: <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        };
        return icons[name] || null;
      };

      return (
        <div>
          <div className="app-header">
            <div className="logo-area">
              <Cloud3Logo size={34} />
              <h1>Zebra Labels <span>| Cloud3</span></h1>
            </div>
            <div className={`printer-status ${printerStatus}`} onClick={checkPrinter} title="Verifica stampante">
              <div className={`dot ${printerStatus==='online'?'green':printerStatus==='offline'?'red':'yellow'}`}></div>
              GK420t — {printerStatus==='online'?'Online':printerStatus==='offline'?'Offline':'Verifica...'}
              <span style={{fontSize:11,opacity:.6}}>{settings.printer_ip}</span>
            </div>
          </div>
          <div className="tabs">
            {['stampa','designer','storico','clienti','impostazioni'].map(t => (
              <div key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)} style={{display:'flex',alignItems:'center',gap:6}}>
                <TabIcon name={t} />
                {t.charAt(0).toUpperCase()+t.slice(1)}
              </div>
            ))}
          </div>
          <div className="main">
            {tab==='stampa' && <PrintPage clienti={clienti} modelli={modelli} setToast={setToast} reloadClienti={loadClienti} settings={settings} />}
            {tab==='designer' && <DesignerPage modelli={modelli} reloadModelli={loadModelli} setToast={setToast} settings={settings} />}
            {tab==='storico' && <StoricoPage setToast={setToast} />}
            {tab==='clienti' && <ClientiPage clienti={clienti} reloadClienti={loadClienti} setToast={setToast} />}
            {tab==='impostazioni' && <SettingsPage settings={settings} onSave={setSettings} setToast={setToast} />}
          </div>
          {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
