    // ====== Main Print Page ======
    function PrintPage({ clienti, modelli, setToast, reloadClienti, settings }) {
      const [modoCliente, setModoCliente] = useState('rubrica');
      const [cliente, setCliente] = useState(null);
      const [clienteManuale, setClienteManuale] = useState({ ragione_sociale:'', telefono:'', email:'', indirizzo:'', citta:'' });
      const [salvaRubrica, setSalvaRubrica] = useState(false);
      const [modelloNome, setModelloNome] = useState('Preparazione Dispositivo');
      const [tipoDisp, setTipoDisp] = useState('PC Desktop');
      const [modalita, setModalita] = useState('Automatica');
      const [nomeManuale, setNomeManuale] = useState('');
      const [prefisso, setPrefisso] = useState('');
      const [quantita, setQuantita] = useState(1);
      const [copie, setCopie] = useState(1);
      const [zplPreview, setZplPreview] = useState('');
      const [printing, setPrinting] = useState(false);

      const modelloObj = modelli.find(m => m.nome === modelloNome);
      const clienteEff = modoCliente === 'nessuno'
        ? { ragione_sociale: '', telefono: '', email: '', indirizzo: '', citta: '' }
        : modoCliente === 'manuale' ? clienteManuale : cliente;

      useEffect(() => {
        if (clienteEff && clienteEff.ragione_sociale && modalita === 'Automatica') {
          const words = clienteEff.ragione_sociale.split(/\s+/);
          let prefix = words[0].substring(0, 3).toUpperCase();
          const year = new Date().getFullYear();
          const tipoCodes = { 'PC Desktop': 'PC', 'Notebook': 'NB', 'Monitor': 'MN', 'Stampante': 'ST', 'Altro': 'XX' };
          setPrefisso(`${prefix}${year}${tipoCodes[tipoDisp] || 'XX'}`);
        } else if (modoCliente === 'nessuno' && modalita === 'Automatica') {
          const year = new Date().getFullYear();
          const tipoCodes = { 'PC Desktop': 'PC', 'Notebook': 'NB', 'Monitor': 'MN', 'Stampante': 'ST', 'Altro': 'XX' };
          setPrefisso(`LAB${year}${tipoCodes[tipoDisp] || 'XX'}`);
        }
      }, [clienteEff?.ragione_sociale, tipoDisp, modalita, modoCliente]);

      const nomeDisp = modalita === 'Manuale' ? nomeManuale : (prefisso ? `${prefisso}01` : '---');
      const nomiGen = modalita === 'Automatica' && prefisso
        ? Array.from({length: quantita}, (_, i) => `${prefisso}${String(i+1).padStart(2,'0')}`)
        : [nomeManuale || 'DISPOSITIVO'];
      const canPrint = modoCliente === 'nessuno' || (modoCliente === 'rubrica' && cliente) || (modoCliente === 'manuale');

      const buildBody = () => ({
        cliente_id: cliente?.id || 0,
        modello: modelloNome,
        modello_id: modelloObj?.id,
        tipo_dispositivo: tipoDisp,
        modalita, nome_dispositivo: nomeManuale, prefisso, quantita, copie,
        modo_cliente: modoCliente,
        cliente_manuale: modoCliente === 'manuale' ? clienteManuale : undefined,
        salva_in_rubrica: salvaRubrica,
        stampante_ip: settings.printer_ip,
        stampante_porta: settings.printer_port
      });

      const handleGenera = async () => {
        if (!canPrint) return setToast({ message: 'Configura il cliente', type: 'error' });
        const res = await fetch(`${API}/stampa/genera-zpl`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBody())
        });
        const data = await res.json();
        setZplPreview(data.zpl);
      };

      const handleStampa = async () => {
        if (!canPrint) return setToast({ message: 'Configura il cliente', type: 'error' });
        setPrinting(true);
        try {
          const res = await fetch(`${API}/stampa/invia`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(buildBody())
          });
          const data = await res.json();
          if (data.success) {
            setToast({ message: `Stampate ${data.etichette_generate} etichette (${data.totale_stampe_fisiche} copie)`, type: 'success' });
            if (salvaRubrica && modoCliente === 'manuale' && reloadClienti) reloadClienti();
          } else {
            setToast({ message: data.error || 'Errore stampa', type: 'error' });
          }
        } catch (e) {
          setToast({ message: 'Errore connessione', type: 'error' });
        } finally { setPrinting(false); }
      };

      return (
        <>
          <div className="page-title">Stampa</div>
          <div className="page-subtitle">Genera e stampa etichette per i tuoi dispositivi</div>
          <div className="grid-2">
            <div>
              <div className="card">
                <h2>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                  Configurazione
                </h2>

                <div className="field">
                  <label>Modalità Cliente</label>
                  <div className="radio-group">
                    {[
                      { id: 'rubrica', label: 'Rubrica' },
                      { id: 'manuale', label: 'Manuale' },
                      { id: 'nessuno', label: 'Laboratorio' }
                    ].map(m => (
                      <div key={m.id} className={`radio-option ${modoCliente === m.id ? 'selected' : ''}`}
                        onClick={() => setModoCliente(m.id)}>
                        {m.label}
                      </div>
                    ))}
                  </div>
                  {modoCliente === 'nessuno' && (
                    <div style={{fontSize:12,color:'var(--yellow)',marginTop:8,fontWeight:500}}>
                      ⚠ Etichetta generica di laboratorio — nessun dato cliente
                    </div>
                  )}
                </div>

                {modoCliente === 'rubrica' && (
                  <div className="field">
                    <label>Cliente *</label>
                    <ClientSearch clienti={clienti} onSelect={setCliente} />
                    {cliente && (
                      <div className="client-info">
                        <div><div className="ci-label">Telefono</div><div className="ci-value">{cliente.telefono || 'N/D'}</div></div>
                        <div><div className="ci-label">Email</div><div className="ci-value">{cliente.email || 'N/D'}</div></div>
                        <div><div className="ci-label">Indirizzo</div><div className="ci-value">{cliente.indirizzo || 'N/D'}</div></div>
                        <div><div className="ci-label">Città</div><div className="ci-value">{cliente.citta || 'N/D'}</div></div>
                      </div>
                    )}
                  </div>
                )}

                {modoCliente === 'manuale' && (
                  <div style={{background:'var(--bg3)',borderRadius:12,padding:14,marginBottom:14}}>
                    <div className="field">
                      <label>Ragione Sociale</label>
                      <input value={clienteManuale.ragione_sociale} onChange={e => setClienteManuale({...clienteManuale, ragione_sociale: e.target.value})}
                        placeholder="Nome azienda o persona" />
                    </div>
                    <div className="inline-row">
                      <div className="field">
                        <label>Telefono</label>
                        <input value={clienteManuale.telefono} onChange={e => setClienteManuale({...clienteManuale, telefono: e.target.value})} />
                      </div>
                      <div className="field">
                        <label>Email</label>
                        <input value={clienteManuale.email} onChange={e => setClienteManuale({...clienteManuale, email: e.target.value})} />
                      </div>
                    </div>
                    <div className="inline-row">
                      <div className="field">
                        <label>Indirizzo</label>
                        <input value={clienteManuale.indirizzo} onChange={e => setClienteManuale({...clienteManuale, indirizzo: e.target.value})} />
                      </div>
                      <div className="field">
                        <label>Città</label>
                        <input value={clienteManuale.citta} onChange={e => setClienteManuale({...clienteManuale, citta: e.target.value})} placeholder="Es: Genova (GE)" />
                      </div>
                    </div>
                    <label style={{display:'flex',alignItems:'center',gap:10,marginTop:4,cursor:'pointer',marginBottom:0}}>
                      <input type="checkbox" style={{width:'auto',accentColor:'var(--accent)',transform:'scale(1.2)'}} checked={salvaRubrica}
                        onChange={e => setSalvaRubrica(e.target.checked)} />
                      <span style={{fontSize:14,color:'var(--text)'}}>Salva questo cliente in rubrica dopo la stampa</span>
                    </label>
                  </div>
                )}

                <div className="field">
                  <label>Modello Etichetta</label>
                  <select value={modelloNome} onChange={e => setModelloNome(e.target.value)}>
                    {modelli.map(m => (
                      <option key={m.id} value={m.nome}>{m.nome}{m.is_custom ? ' ✨' : ''}</option>
                    ))}
                  </select>
                </div>
                <div className="field">
                  <label>Tipo Dispositivo</label>
                  <div className="device-pills">
                    {['PC Desktop','Notebook','Monitor','Stampante','Altro'].map(t => (
                      <button key={t} className={`device-pill ${tipoDisp===t?'active':''}`} onClick={()=>setTipoDisp(t)}>{t}</button>
                    ))}
                  </div>
                </div>
                <div className="field">
                  <label>Modalità Nome</label>
                  <div className="radio-group">
                    {['Manuale', 'Automatica'].map(m => (
                      <div key={m} className={`radio-option ${modalita === m ? 'selected' : ''}`} onClick={() => setModalita(m)}>
                        {m}
                      </div>
                    ))}
                  </div>
                </div>
                {modalita === 'Manuale' ? (
                  <div className="field">
                    <label>Nome Dispositivo</label>
                    <input value={nomeManuale} onChange={e => setNomeManuale(e.target.value)} placeholder="Es: PC-RECEPTION-01" />
                  </div>
                ) : (
                  <>
                    <div className="field">
                      <label>Prefisso</label>
                      <input value={prefisso} onChange={e => setPrefisso(e.target.value)} placeholder="Es: CAV2026PC" />
                    </div>
                    <div className="field">
                      <label>Quantità (1-20)</label>
                      <div className="counter">
                        <button onClick={() => setQuantita(Math.max(1, quantita - 1))}>&#8722;</button>
                        <input type="number" min="1" max="20" value={quantita}
                          onChange={e => setQuantita(Math.min(20, Math.max(1, parseInt(e.target.value) || 1)))} />
                        <button className="plus" onClick={() => setQuantita(Math.min(20, quantita + 1))}>+</button>
                      </div>
                      {quantita > 1 && <div style={{fontSize:12,color:'var(--text2)',marginTop:8}}>
                        Nomi: {nomiGen.slice(0,3).join(', ')}{quantita > 3 ? `, ... ${nomiGen[quantita-1]}` : ''}
                      </div>}
                    </div>
                  </>
                )}
                <div className="field">
                  <label>Copie per etichetta (1-99)</label>
                  <div className="counter">
                    <button onClick={() => setCopie(Math.max(1, copie - 1))}>&#8722;</button>
                    <input type="number" min="1" max="99" value={copie}
                      onChange={e => setCopie(Math.min(99, Math.max(1, parseInt(e.target.value) || 1)))} />
                    <button className="plus" onClick={() => setCopie(Math.min(99, copie + 1))}>+</button>
                  </div>
                </div>
              </div>
              <div style={{display:'flex',gap:10,marginTop:4}}>
                <button className="btn btn-outline" style={{flex:1}} onClick={handleGenera}>Genera ZPL</button>
                <button className="btn btn-primary btn-lg" style={{flex:2}} onClick={handleStampa} disabled={printing || !canPrint}>
                  {printing ? (
                    'Invio...'
                  ) : (
                    <>
                      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
                      Stampa Etichetta
                    </>
                  )}
                </button>
              </div>
            </div>
            <div>
              <div className="card">
                <h2>Anteprima Etichetta</h2>
                <LabelPreview modello={modelloNome} modelloObj={modelloObj} cliente={clienteEff} tipoDisp={tipoDisp} nomeDisp={nomeDisp} />
                {modalita === 'Automatica' && quantita > 1 && (
                  <div style={{marginTop:12,fontSize:13,color:'var(--text2)',textAlign:'center',fontWeight:500}}>
                    Anteprima prima etichetta — {quantita} × {copie} = <strong style={{color:'var(--accent)'}}>{quantita * copie} stampe</strong>
                  </div>
                )}
              </div>
              {zplPreview && (
                <div style={{marginBottom:14}}>
                  <div className="zpl-viewer">
                    <div className="zpl-viewer-header">
                      <div className="left">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                        <span>ZPL Code Viewer</span>
                      </div>
                      <button className="btn btn-sm" style={{background:'rgba(255,255,255,0.08)',color:'#fff',minHeight:28,padding:'4px 12px',fontSize:12}}
                        onClick={() => { navigator.clipboard.writeText(zplPreview); setToast({message:'ZPL copiato!',type:'success'}); }}>
                        Copia
                      </button>
                    </div>
                    <div className="zpl-code">{zplPreview}</div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </>
      );
    }

    // ====== Storico Page ======
    function StoricoPage({ setToast }) {
      const [logs, setLogs] = useState([]);
      const [total, setTotal] = useState(0);
      const [page, setPage] = useState(1);
      const fetchLogs = async () => {
        const res = await fetch(`${API}/stampa/log?page=${page}&limit=15`);
        const data = await res.json();
        setLogs(data.logs); setTotal(data.total);
      };
      useEffect(() => { fetchLogs(); }, [page]);

      const handleRistampa = async (id) => {
        const res = await fetch(`${API}/stampa/ristampa/${id}`, { method: 'POST' });
        const data = await res.json();
        setToast({ message: data.success ? 'Ristampa inviata!' : (data.error || 'Errore'), type: data.success ? 'success' : 'error' });
        if (data.success) fetchLogs();
      };
      const totalPages = Math.ceil(total / 15);
      const successi = logs.filter(l => l.stato === 'inviato' || l.stato === 'ristampato').length;
      const errori = logs.filter(l => l.stato !== 'inviato' && l.stato !== 'ristampato').length;

      return (
        <>
          <div className="page-title">Storico</div>
          <div className="page-subtitle">{total} stampe totali</div>

          {/* Stats cards */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:12,marginBottom:20}}>
            <div className="card" style={{margin:0,padding:16}}>
              <div style={{fontSize:12,color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>Totale</div>
              <div style={{fontSize:28,fontWeight:700,marginTop:4,letterSpacing:'-0.02em'}}>{total}</div>
            </div>
            <div className="card" style={{margin:0,padding:16}}>
              <div style={{fontSize:12,color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>Successo</div>
              <div style={{fontSize:28,fontWeight:700,marginTop:4,color:'var(--green)',letterSpacing:'-0.02em'}}>{successi}</div>
            </div>
            <div className="card" style={{margin:0,padding:16}}>
              <div style={{fontSize:12,color:'var(--text2)',fontWeight:600,textTransform:'uppercase',letterSpacing:'0.06em'}}>Errori</div>
              <div style={{fontSize:28,fontWeight:700,marginTop:4,color:'var(--red)',letterSpacing:'-0.02em'}}>{errori}</div>
            </div>
          </div>

          <div className="card">
            {logs.length === 0 ? (
              <div className="empty-state">
                <div className="icon">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
                <div>Nessuna stampa registrata</div>
              </div>
            ) : (
              <>
                <div style={{overflowX:'auto'}}>
                  <table className="log-table">
                    <thead><tr><th>#</th><th>Data</th><th>Cliente</th><th>Modello</th><th>Dispositivo</th><th>Qta</th><th>Stato</th><th></th></tr></thead>
                    <tbody>
                      {logs.map(l => {
                        const d = new Date(l.data_stampa);
                        return (
                          <tr key={l.id}>
                            <td style={{color:'var(--text2)',fontSize:13}}>{l.id}</td>
                            <td style={{whiteSpace:'nowrap',fontSize:13}}>{d.getDate()}/{d.getMonth()+1} {String(d.getHours()).padStart(2,'0')}:{String(d.getMinutes()).padStart(2,'0')}</td>
                            <td style={{fontWeight:600}}>{l.cliente_nome}</td>
                            <td style={{fontSize:13,color:'var(--text2)'}}>{l.modello}</td>
                            <td style={{fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',color:'var(--text2)'}}>{l.nome_dispositivo}</td>
                            <td style={{fontSize:13}}>{l.quantita}×{l.copie}</td>
                            <td><span className={`badge ${l.stato==='inviato'||l.stato==='ristampato'?'badge-green':'badge-red'}`}>{l.stato}</span></td>
                            <td><button className="btn btn-icon" onClick={() => handleRistampa(l.id)} title="Ristampa">
                              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
                            </button></td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
                {totalPages > 1 && (
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',gap:10,marginTop:20,paddingTop:16,borderTop:'var(--hairline)'}}>
                    <button className="btn btn-outline btn-sm" disabled={page<=1} onClick={()=>setPage(p=>p-1)}>← Precedente</button>
                    <span style={{fontSize:13,color:'var(--text2)',fontWeight:500}}>Pagina {page} di {totalPages}</span>
                    <button className="btn btn-outline btn-sm" disabled={page>=totalPages} onClick={()=>setPage(p=>p+1)}>Successiva →</button>
                  </div>
                )}
              </>
            )}
          </div>
        </>
      );
    }

    // ====== Clienti Page ======
    function ClientiPage({ clienti, reloadClienti, setToast }) {
      const [search, setSearch] = useState('');
      const [editing, setEditing] = useState(null);
      const [form, setForm] = useState({ ragione_sociale: '', telefono: '', email: '', indirizzo: '', citta: '' });
      const filtered = search ? clienti.filter(c => c.ragione_sociale.toLowerCase().includes(search.toLowerCase())) : clienti;

      const handleSave = async () => {
        if (!form.ragione_sociale.trim()) return setToast({ message: 'Ragione sociale obbligatoria', type: 'error' });
        const url = editing === 'new' ? `${API}/clienti` : `${API}/clienti/${editing}`;
        await fetch(url, { method: editing==='new'?'POST':'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(form) });
        setToast({ message: editing==='new'?'Cliente creato!':'Cliente aggiornato!', type: 'success' });
        setEditing(null); reloadClienti();
      };

      return (
        <>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',marginBottom:20,gap:12,flexWrap:'wrap'}}>
            <div>
              <div className="page-title">Clienti</div>
              <div className="page-subtitle" style={{marginBottom:0}}>{clienti.length} clienti in rubrica</div>
            </div>
            <button className="btn btn-primary" onClick={()=>{setForm({ragione_sociale:'',telefono:'',email:'',indirizzo:'',citta:''});setEditing('new');}}>+ Nuovo Cliente</button>
          </div>

          <div className="card">
            <div className="search-input" style={{marginBottom:16}}>
              <input placeholder="Cerca cliente..." value={search} onChange={e=>setSearch(e.target.value)} />
            </div>
            <div style={{overflowX:'auto',maxHeight:'62vh',overflowY:'auto'}}>
              <table className="log-table">
                <thead><tr><th>ID</th><th>Ragione Sociale</th><th>Telefono</th><th>Email</th><th>Città</th><th></th></tr></thead>
                <tbody>
                  {filtered.slice(0,50).map(c => (
                    <tr key={c.id}>
                      <td style={{color:'var(--text2)',fontSize:13}}>{c.id}</td>
                      <td style={{fontWeight:600}}>{c.ragione_sociale}</td>
                      <td style={{fontSize:13}}>{c.telefono||'—'}</td>
                      <td style={{fontSize:13,color:'var(--text2)'}}>{c.email||'—'}</td>
                      <td style={{fontSize:13}}>{c.citta||'—'}</td>
                      <td>
                        <button className="btn btn-icon" onClick={()=>{setForm({ragione_sociale:c.ragione_sociale,telefono:c.telefono,email:c.email,indirizzo:c.indirizzo,citta:c.citta});setEditing(c.id);}}>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            {filtered.length > 50 && <div style={{textAlign:'center',padding:14,fontSize:13,color:'var(--text2)',fontWeight:500}}>Visualizzati 50 di {filtered.length} — affina la ricerca</div>}
          </div>

          {editing !== null && (
            <div className="modal-overlay" onClick={()=>setEditing(null)}>
              <div className="modal" onClick={e=>e.stopPropagation()}>
                <h3>{editing==='new'?'Nuovo Cliente':'Modifica Cliente'}</h3>
                {['ragione_sociale','telefono','email','indirizzo','citta'].map(k => (
                  <div className="field" key={k}>
                    <label>{k==='ragione_sociale'?'Ragione Sociale *':k==='citta'?'Città':k.charAt(0).toUpperCase()+k.slice(1)}</label>
                    <input value={form[k]} onChange={e=>setForm({...form,[k]:e.target.value})} placeholder={k==='citta'?'Es: Genova (GE)':''} />
                  </div>
                ))}
                <div className="modal-actions">
                  <button className="btn btn-outline" onClick={()=>setEditing(null)}>Annulla</button>
                  <button className="btn btn-primary" onClick={handleSave}>Salva</button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    // ====== App ======
    function App() {
      const [tab, setTab] = useState('stampa');
      const [clienti, setClienti] = useState([]);
      const [modelli, setModelli] = useState([]);
      const [printerStatus, setPrinterStatus] = useState('checking');
      const [toast, setToast] = useState(null);
      const [settings, setSettings] = useState({
        printer_ip: '10.0.50.92', printer_port: 9100,
        label_width_mm: 55, label_height_mm: 35, dpi: 203
      });

      const loadClienti = async () => { const r = await fetch(`${API}/clienti/all`); setClienti(await r.json()); };
      const loadModelli = async () => { const r = await fetch(`${API}/modelli`); setModelli(await r.json()); };
      const loadSettings = async () => {
        try { const r = await fetch(`${API}/impostazioni`); const d = await r.json(); setSettings(d); } catch(e) {}
      };
      const checkPrinter = async () => {
        try {
          setPrinterStatus('checking');
          const r = await fetch(`${API}/stampante/stato?ip=${settings.printer_ip}&porta=${settings.printer_port}`);
          const d = await r.json();
          setPrinterStatus(d.online ? 'online' : 'offline');
        } catch(e) { setPrinterStatus('offline'); }
      };

      useEffect(() => {
        loadClienti(); loadModelli(); loadSettings();
      }, []);

      useEffect(() => {
        checkPrinter();
        const iv = setInterval(checkPrinter, 30000);
        return () => clearInterval(iv);
      }, [settings.printer_ip, settings.printer_port]);

      const TabIcon = ({ name }) => {
        const icons = {
          stampa: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>,
          designer: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>,
          storico: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
          clienti: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
          impostazioni: <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        };
        return icons[name] || null;
      };

      const tabLabels = {
        stampa: 'Stampa', designer: 'Designer', storico: 'Storico',
        clienti: 'Clienti', impostazioni: 'Config'
      };

      return (
        <div>
          <div className="app-header">
            <div className="logo-area">
              <Cloud3Logo size={32} />
              <h1>Zebra Labels <span>| Cloud3</span></h1>
            </div>
            <div className={`printer-status ${printerStatus}`} onClick={checkPrinter} title="Verifica stampante">
              <div className={`dot ${printerStatus==='online'?'green':printerStatus==='offline'?'red':'yellow'}`}></div>
              <span>{printerStatus==='online'?'Online':printerStatus==='offline'?'Offline':'Verifica...'}</span>
              <span className="ip">{settings.printer_ip}</span>
            </div>
          </div>

          <div className="main">
            {tab==='stampa' && <PrintPage clienti={clienti} modelli={modelli} setToast={setToast} reloadClienti={loadClienti} settings={settings} />}
            {tab==='designer' && <DesignerPage modelli={modelli} reloadModelli={loadModelli} setToast={setToast} settings={settings} />}
            {tab==='storico' && <StoricoPage setToast={setToast} />}
            {tab==='clienti' && <ClientiPage clienti={clienti} reloadClienti={loadClienti} setToast={setToast} />}
            {tab==='impostazioni' && <SettingsPage settings={settings} onSave={setSettings} setToast={setToast} />}
          </div>

          <div className="tabs">
            {['stampa','designer','storico','clienti','impostazioni'].map(t => (
              <div key={t} className={`tab ${tab===t?'active':''}`} onClick={()=>setTab(t)}>
                <TabIcon name={t} />
                <span>{tabLabels[t]}</span>
              </div>
            ))}
          </div>

          {toast && <Toast message={toast.message} type={toast.type} onClose={()=>setToast(null)} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
